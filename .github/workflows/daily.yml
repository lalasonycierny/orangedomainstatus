name: Daily scan

on:
  schedule:
    - cron: "17 3 * * *"   # kazdy den 03:17 UTC
  workflow_dispatch:        # umoznuje spustit rucne z karty Actions

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run scan
        env:
          # Firmy a domeny sa nastavuju v companies.json.
          # Volitelne premenne: Settings -> Secrets and variables -> Actions -> Variables
          PUBLISH_MODE: ${{ vars.PUBLISH_MODE }}     # summary (default) | full
          SCAN_PREFIXES: ${{ vars.SCAN_PREFIXES }}   # 1 = skenuj aj prefixy
          MAX_IPS: ${{ vars.MAX_IPS }}
        run: python scan.py

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data data/cve_cache.json data/history
          if git diff --cached --quiet; then
            echo "Bez zmien."
          else
            git commit -m "Daily scan $(date -u +%F)"
            git push
          fi